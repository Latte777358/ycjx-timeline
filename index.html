<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F0EC">
<title>御磁坚盾 · 小组分工与贡献时间线</title>
<style>
:root{--bg:#F3F0EC;--card:#FCFBF9;--ink:#3F4245;--ink2:#6E7477;--ink3:#9AA0A2;--line:#E4DED6;--chip:#EAE4DC;--shadow:0 2px 10px rgba(86,78,70,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
header{padding:24px 0 10px}
h1{font-size:21px;line-height:1.4;margin:0 0 10px;font-weight:700;letter-spacing:.3px}
.sub{color:var(--ink2);font-size:13.5px;margin:0 0 6px}
.hero{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.pill{background:var(--chip);color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:12.5px}
.section{margin:26px 0 10px;font-size:16px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.section::after{content:"";flex:1;height:1px;background:var(--line)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.pcard{background:var(--card);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);border-left:4px solid var(--c)}
.pcard .nm{font-weight:700;font-size:14.5px;color:var(--c)}
.pcard .ph{color:var(--ink3);font-size:12px;margin-top:1px}
.pcard .rl{color:var(--ink2);font-size:12.5px;margin-top:6px;line-height:1.55}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 14px;font-size:13px;font-family:inherit}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl{position:relative;margin-top:14px;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.item{position:relative;margin:0 0 14px}
.item::before{content:"";position:absolute;left:-19px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.card{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.when{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.who{font-size:12.5px;font-weight:600;color:#fff;background:var(--c);border-radius:999px;padding:2.5px 10px}
.txt{font-size:14.3px;line-height:1.72}
.quote{margin-top:8px;padding:8px 11px;background:#F1EDE7;border-radius:9px;color:var(--ink2);font-size:12.8px;line-height:1.65}
.files{display:flex;gap:9px;overflow-x:auto;margin-top:11px;padding-bottom:4px;scrollbar-width:none}
.files::-webkit-scrollbar{display:none}
.file{flex:0 0 auto;width:126px;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;text-align:left;box-shadow:var(--shadow)}
.file .thumb{all:unset;cursor:pointer;display:block}
.file img{width:100%;height:88px;object-fit:cover;object-position:top center;display:block;background:#EFEAE3}
.file .fn{font-size:11.3px;line-height:1.45;padding:6px 7px 2px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.file .fm{font-size:10.5px;color:var(--ink3);padding:0 7px 4px}
.file .go{font-size:10.8px;color:#8C7F70;padding:0 7px 8px}
.file .dl{padding:0 7px 8px}
.file .dl a{display:inline-block;margin:0 5px 4px 0;font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;color:var(--ink2);text-decoration:none;background:#fff}
.viewer{position:fixed;inset:0;background:#2E2B28;display:none;flex-direction:column;z-index:50}
.viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.vbar .vt{flex:1;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .pg{font-size:12px;color:var(--ink3);white-space:nowrap}
.vbar button{border:1px solid var(--line);background:var(--ink);color:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;font-family:inherit}
#strip{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
#strip div{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:12px}
#strip img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.35);background:#fff}
.hint{color:#BDB6AE;font-size:11.5px;text-align:center;padding:6px 0 10px}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink3);font-size:12.2px;line-height:1.75}
</style>
</head>

const F = DATA.files, TL = DATA.tl, MB = DATA.members;

function fcard(id){
  const f = F[id]; if(!f) return "";
  const label = (f.orgs[0] && f.orgs[0].ext === "zip") ? "ZIP 压缩包" : "无可预览页";
  const thumbInner = f.imgs.length
    ? `<img src="${f.imgs[0]}" alt="${f.title}" loading="lazy">`
    : `<div style="height:88px;display:flex;align-items:center;justify-content:center;background:#EFEAE3;color:#A79E93;font-size:12px;letter-spacing:1px">${label}</div>`;
  const dl = f.orgs.map(o => `<a href="${o.url}" download="${o.name}">${o.ext.toUpperCase()}</a>`).join("");
  const pg = f.pages === 0 ? (f.orgs[0] ? (f.orgs[0].size/1048576).toFixed(1) + " MB 压缩包" : "文件") : (f.shown < f.pages ? `共 ${f.pages} 页 · 预览前 ${f.shown} 页` : `共 ${f.pages} 页`);
  return `<div class="file">
    <button class="thumb" data-view="${id}">
      ${thumbInner}
      <div class="fn">${f.title}</div>
      <div class="fm">${pg}</div>
      <div class="go">点击逐页查看 →</div>
    </button>
    <div class="dl">${dl}</div></div>`;
}
function renderTL(member){

    const fl = i[3] && i[3].length ? `<div class="files">${i[3].map(fcard).join("")}</div>` : "";

}

  document.getElementById("allfiles").innerHTML = Object.keys(F).map(fcard).join("");
  renderTL("全部");
  document.getElementById("foot").innerHTML = `数据来源：2026 年 10 月 15 日 20:43 群内转发的三段聊天记录，共 217 条转发消息、176 条组员发言，时间跨度 10 月 4 日 21:03 至 10 月 15 日 20:36。<br>
    文件为小组成员在群里交付的原件。文件卡片下方的按钮可直接保存原件；标注「群文件」的是体积较大、未内嵌的 PPT，可在群文件中下载。<br>
    本页含个人信息，仅在小组成员内部使用。`;
}
init();
document.addEventListener("click", e => {
  const fb = e.target.closest(".fbtn");
  if (fb){ document.querySelectorAll(".fbtn").forEach(b => b.classList.remove("on")); fb.classList.add("on"); renderTL(fb.dataset.m); return; }
  if (e.target.closest("a")) return;
  const th = e.target.closest(".thumb");
  if (th){
    const f = F[th.dataset.view];
    document.getElementById("vtitle").textContent = f.title;
    document.getElementById("strip").innerHTML = f.imgs.map((src, i) => `<div><img src="${src}" alt="${f.title} 第 ${i+1} 页"></div>`).join("");
    document.getElementById("vpg").textContent = `1 / ${f.shown}`;
    document.getElementById("vhint").textContent = f.shown < f.pages ? `左右滑动翻页 · 共 ${f.pages} 页，这里展示前 ${f.shown} 页` : "左右滑动翻页";
    document.getElementById("strip").scrollLeft = 0;
    document.getElementById("viewer").classList.add("on");
    document.body.style.overflow = "hidden";
  }
});
document.getElementById("vclose").addEventListener("click", () => {
  document.getElementById("viewer").classList.remove("on");
  document.getElementById("strip").innerHTML = "";
  document.body.style.overflow = "";
});
document.getElementById("strip").addEventListener("scroll", e => {
  const s = e.target, total = s.children.length;
  document.getElementById("vpg").textContent = `${Math.round(s.scrollLeft / s.clientWidth) + 1} / ${total}`;
});
</script>
</body>
</html>
